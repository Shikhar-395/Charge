<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recharge Overlay</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .app {
        display: grid;
        width: min(88vmin, 640px);
        justify-items: center;
        gap: min(2.8vmin, 22px);
      }

      .stage {
        position: relative;
        width: min(78vmin, 560px);
        aspect-ratio: 1;
        overflow: hidden;
        background: #fff;
      }

      .recharge-overlay {
        position: absolute;
        top: 18%;
        left: 14%;
        width: 72%;
        height: 64%;
        overflow: hidden;
        border-radius: 28%;
        isolation: isolate;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.095), rgba(255, 255, 255, 0.02) 30%, rgba(0, 0, 0, 0) 48%),
          linear-gradient(180deg, #212221 0%, #181816 39%, #170f0e 69%, #19090b 100%);
        box-shadow:
          inset 0 min(1.35vmin, 10px) min(2.25vmin, 16px) rgba(255, 255, 255, 0.055),
          inset 0 max(-2.35vmin, -17px) min(3.9vmin, 28px) rgba(255, 54, 68, 0.12),
          0 min(3.9vmin, 28px) min(7.3vmin, 53px) rgba(111, 14, 33, 0.28),
          0 min(1.2vmin, 9px) min(2.2vmin, 16px) rgba(0, 0, 0, 0.18);
        animation: none;
      }

      .recharge-overlay::before {
        content: "";
        position: absolute;
        inset: min(0.85vmin, 6px) min(1.1vmin, 8px) auto;
        height: 31%;
        border-radius: 999px 999px 44% 44%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.105), rgba(255, 255, 255, 0));
        opacity: 0.32;
        pointer-events: none;
        z-index: 1;
      }

      .recharge-overlay::after {
        content: "";
        position: absolute;
        inset: 29% 12% 8%;
        opacity: 0.25;
        background-image: radial-gradient(circle, rgba(255, 129, 112, 0.21) 0 0.8px, transparent 1.55px);
        background-size: min(1.12vmin, 8px) min(1.12vmin, 8px);
        mask-image: linear-gradient(180deg, transparent 0%, #000 29%, #000 86%, transparent 100%);
        pointer-events: none;
        z-index: 2;
        animation: none;
      }

      .mood {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        z-index: 0;
      }

      .mood-red {
        background:
          radial-gradient(80% 44% at 50% 94%, rgba(255, 42, 62, 0.26), rgba(255, 42, 62, 0) 68%),
          radial-gradient(72% 52% at 50% 78%, rgba(255, 107, 75, 0.11), rgba(255, 107, 75, 0) 72%);
        opacity: 1;
        animation: none;
      }

      .mood-green {
        background:
          radial-gradient(82% 49% at 50% 92%, rgba(52, 255, 21, 0.2), rgba(52, 255, 21, 0) 70%),
          radial-gradient(72% 52% at 54% 78%, rgba(199, 255, 26, 0.095), rgba(199, 255, 26, 0) 70%);
        opacity: 0;
        animation: none;
      }

      .title {
        position: absolute;
        top: 14.8%;
        left: 50%;
        z-index: 4;
        margin: 0;
        color: #fff;
        font-family: "SF Pro Rounded", "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, Arial, sans-serif;
        font-size: min(7.1vmin, 51px);
        font-weight: 600;
        line-height: 0.96;
        letter-spacing: -0.05em;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
        transform: translateX(-50%) scaleX(1.06);
        transform-origin: center top;
      }

      .scale {
        position: absolute;
        top: 44.8%;
        left: 10.8%;
        right: 10.8%;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(255, 255, 255, 0.17);
        font-size: min(3.2vmin, 23px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .battery {
        position: absolute;
        top: 58.3%;
        left: 8.4%;
        z-index: 4;
        width: 83.2%;
        height: 30.2%;
        overflow: hidden;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.025) 41%, rgba(255, 255, 255, 0.055) 100%),
          linear-gradient(90deg, rgba(54, 30, 32, 0.86), rgba(42, 35, 34, 0.84));
        box-shadow:
          inset 0 min(1.7vmin, 12px) min(2.65vmin, 19px) rgba(255, 255, 255, 0.075),
          inset 0 max(-1.1vmin, -8px) min(2.25vmin, 16px) rgba(255, 91, 82, 0.24),
          0 min(1.65vmin, 12px) min(3.45vmin, 25px) rgba(255, 39, 70, 0.32),
          0 min(0.55vmin, 4px) min(1.25vmin, 9px) rgba(0, 0, 0, 0.2);
        animation: none;
      }

      .battery::before {
        content: "";
        position: absolute;
        inset: 11% 8% 9%;
        z-index: 2;
        opacity: 0.24;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.13) 0 0.75px, transparent 1.55px);
        background-size: min(1.08vmin, 7.8px) min(1.08vmin, 7.8px);
        mask-image: linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
        pointer-events: none;
      }

      .battery::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 5;
        border-radius: inherit;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.035) 36%, rgba(0, 0, 0, 0) 56%, rgba(255, 255, 255, 0.075) 100%),
          radial-gradient(106% 115% at 50% 0%, rgba(255, 255, 255, 0.14), transparent 50%);
        box-shadow:
          inset 0 min(0.4vmin, 3px) min(1.4vmin, 10px) rgba(255, 255, 255, 0.09),
          inset 0 max(-0.42vmin, -3px) min(1.65vmin, 12px) rgba(255, 255, 255, 0.05);
        pointer-events: none;
      }

      .charge-fill {
        --liquid-front-start: #ff0b42;
        --liquid-front-mid: #ff2730;
        --liquid-front-end: #ff9f18;
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        border-radius: inherit;
        overflow: hidden;
        clip-path: inset(0 round 999px);
        background: transparent;
        box-shadow: none;
        animation: none;
      }

      .charge-fill::before {
        content: "";
        display: none;
        position: absolute;
        inset: 0 min(4.65vmin, 26px) 0 0;
        border-radius: 999px 0 0 999px;
        opacity: 1;
        background:
          radial-gradient(60% 88% at 12% 50%, rgba(255, 0, 66, 1), rgba(255, 16, 62, 0.96) 48%, transparent 76%),
          radial-gradient(46% 80% at 86% 50%, rgba(255, 121, 28, 0.82), transparent 72%),
          linear-gradient(90deg, #ff003f 0%, #ff1837 58%, #ff6b1e 100%);
        filter: none;
        mix-blend-mode: normal;
        pointer-events: none;
        animation: liquid-stream 3.8s ease-in-out infinite;
      }

      .charge-fill::after {
        content: "";
        display: none;
        position: absolute;
        top: -7%;
        right: max(-1.2vmin, -8px);
        z-index: 2;
        width: min(78%, min(9.2vmin, 52px));
        height: 114%;
        border-radius: 64% 36% 42% 58% / 34% 58% 42% 66%;
        background:
          radial-gradient(70% 94% at 18% 50%, rgba(255, 9, 66, 0.98), rgba(255, 30, 51, 0.97) 46%, rgba(255, 94, 28, 0.9) 100%),
          linear-gradient(90deg, rgba(255, 12, 62, 0.98), rgba(255, 74, 28, 0.9));
        box-shadow:
          max(-0.85vmin, -6px) 0 min(1.6vmin, 12px) rgba(255, 127, 42, 0.24),
          min(0.8vmin, 6px) 0 min(2.1vmin, 15px) rgba(255, 93, 54, 0.16);
        filter: blur(min(0.35vmin, 2.4px));
        pointer-events: none;
        animation: liquid-front 2.55s ease-in-out infinite;
      }

      .liquid-wave {
        position: absolute;
        inset: 0;
        z-index: 4;
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: none;
        pointer-events: none;
        animation: none;
      }

      .liquid-wave .front-start {
        stop-color: var(--liquid-front-start);
      }

      .liquid-wave .front-mid {
        stop-color: var(--liquid-front-mid);
      }

      .liquid-wave .front-end {
        stop-color: var(--liquid-front-end);
      }

      .battery-glow {
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: inherit;
        background: radial-gradient(88% 92% at 17% 53%, rgba(255, 42, 64, 0.42), rgba(255, 42, 64, 0.1) 38%, transparent 72%);
        animation: none;
      }

      body[data-charge-state="mid"] .recharge-overlay {
        box-shadow:
          inset 0 min(1.35vmin, 10px) min(2.25vmin, 16px) rgba(255, 255, 255, 0.055),
          inset 0 max(-2.35vmin, -17px) min(3.9vmin, 28px) rgba(255, 114, 46, 0.11),
          0 min(3.9vmin, 28px) min(7.3vmin, 53px) rgba(147, 59, 12, 0.24),
          0 min(1.2vmin, 9px) min(2.2vmin, 16px) rgba(0, 0, 0, 0.18);
      }

      body[data-charge-state="high"] .recharge-overlay {
        box-shadow:
          inset 0 min(1.35vmin, 10px) min(2.25vmin, 16px) rgba(255, 255, 255, 0.06),
          inset 0 max(-2.35vmin, -17px) min(3.9vmin, 28px) rgba(68, 255, 39, 0.1),
          0 min(3.9vmin, 28px) min(7.3vmin, 53px) rgba(41, 194, 39, 0.25),
          0 min(1.2vmin, 9px) min(2.2vmin, 16px) rgba(0, 0, 0, 0.18);
      }

      body[data-charge-state="mid"] .battery {
        box-shadow:
          inset 0 min(1.7vmin, 12px) min(2.65vmin, 19px) rgba(255, 255, 255, 0.075),
          inset 0 max(-1.1vmin, -8px) min(2.25vmin, 16px) rgba(255, 130, 41, 0.26),
          0 min(1.65vmin, 12px) min(3.45vmin, 25px) rgba(255, 102, 41, 0.3),
          0 min(0.55vmin, 4px) min(1.25vmin, 9px) rgba(0, 0, 0, 0.2);
      }

      body[data-charge-state="high"] .battery {
        box-shadow:
          inset 0 min(1.7vmin, 12px) min(2.65vmin, 19px) rgba(255, 255, 255, 0.09),
          inset 0 max(-1.1vmin, -8px) min(2.25vmin, 16px) rgba(116, 255, 42, 0.27),
          0 min(1.75vmin, 13px) min(3.65vmin, 26px) rgba(77, 255, 39, 0.36),
          0 min(0.55vmin, 4px) min(1.25vmin, 9px) rgba(0, 0, 0, 0.2);
      }

      body[data-charge-state="mid"] .charge-fill {
        --liquid-front-start: #ff441e;
        --liquid-front-mid: #ff8218;
        --liquid-front-end: #ffe321;
        background: transparent;
        box-shadow: none;
      }

      body[data-charge-state="mid"] .charge-fill::before {
        background:
          radial-gradient(60% 88% at 12% 50%, rgba(255, 58, 29, 1), rgba(255, 96, 25, 0.96) 48%, transparent 76%),
          radial-gradient(46% 80% at 86% 50%, rgba(255, 217, 34, 0.82), transparent 72%),
          linear-gradient(90deg, #ff3621 0%, #ff771b 58%, #ffd321 100%);
      }

      body[data-charge-state="mid"] .charge-fill::after {
        background:
          radial-gradient(70% 94% at 18% 50%, rgba(255, 61, 28, 0.98), rgba(255, 116, 24, 0.97) 46%, rgba(255, 190, 31, 0.9) 100%),
          linear-gradient(90deg, rgba(255, 61, 28, 0.98), rgba(255, 178, 31, 0.9));
        box-shadow:
          max(-0.7vmin, -5px) 0 min(1.6vmin, 12px) rgba(255, 246, 95, 0.28),
          min(0.7vmin, 5px) 0 min(1.8vmin, 13px) rgba(255, 164, 54, 0.18);
      }

      body[data-charge-state="high"] .charge-fill {
        --liquid-front-start: #008f1d;
        --liquid-front-mid: #2cff18;
        --liquid-front-end: #efff21;
        background: transparent;
        box-shadow: none;
      }

      body[data-charge-state="mid"] .liquid-wave {
        filter: none;
      }

      body[data-charge-state="high"] .liquid-wave {
        filter: none;
      }

      body[data-charge-state="high"] .charge-fill::before {
        background:
          radial-gradient(60% 88% at 12% 50%, rgba(0, 109, 26, 1), rgba(24, 221, 23, 0.96) 48%, transparent 76%),
          radial-gradient(46% 80% at 86% 50%, rgba(234, 255, 29, 0.84), transparent 72%),
          linear-gradient(90deg, #006b1b 0%, #1fff15 58%, #efff21 100%);
      }

      body[data-charge-state="high"] .charge-fill::after {
        background:
          radial-gradient(70% 94% at 18% 50%, rgba(0, 145, 27, 0.98), rgba(39, 255, 22, 0.97) 46%, rgba(211, 255, 30, 0.9) 100%),
          linear-gradient(90deg, rgba(21, 224, 24, 0.98), rgba(207, 255, 29, 0.9));
        box-shadow:
          max(-0.7vmin, -5px) 0 min(1.6vmin, 12px) rgba(225, 255, 79, 0.26),
          min(0.7vmin, 5px) 0 min(1.8vmin, 13px) rgba(87, 255, 38, 0.2);
      }

      body[data-charge-state="mid"] .battery-glow {
        background: radial-gradient(88% 92% at 22% 53%, rgba(255, 108, 38, 0.38), rgba(255, 167, 30, 0.12) 48%, transparent 74%);
      }

      body[data-charge-state="high"] .battery-glow {
        background: radial-gradient(102% 98% at 54% 53%, rgba(60, 255, 23, 0.32), rgba(60, 255, 23, 0.15) 46%, transparent 76%);
      }

      body[data-charge-state="high"] .mood-red {
        opacity: 0.1;
      }

      body[data-charge-state="high"] .mood-green {
        opacity: 1;
      }

      body[data-charge-state="high"] .recharge-overlay::after {
        background-image: radial-gradient(circle, rgba(107, 255, 58, 0.17) 0 0.8px, transparent 1.55px);
      }

      .percentage-slider {
        position: relative;
        width: min(58vmin, 420px);
        height: min(12vmin, 86px);
      }

      .slider-field {
        position: relative;
        height: min(7.5vmin, 54px);
      }

      .battery-range {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: ew-resize;
        opacity: 0;
      }

      .slider-visual {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .slider-ticks {
        position: absolute;
        right: 0;
        bottom: min(0.55vmin, 4px);
        left: 0;
        display: flex;
        height: min(5.8vmin, 42px);
        align-items: flex-end;
        justify-content: space-between;
      }

      .tick {
        width: 1px;
        height: min(2.45vmin, 18px);
        background: rgba(14, 14, 14, 0.14);
        transition: height 150ms ease-out, background-color 150ms ease-out;
      }

      .tick:nth-child(5n + 1) {
        height: min(3.8vmin, 28px);
        background: rgba(14, 14, 14, 0.18);
      }

      .tick:first-child,
      .tick:last-child {
        height: min(4.7vmin, 34px);
      }

      .slider-marker {
        position: absolute;
        bottom: min(0.55vmin, 4px);
        left: var(--slider-x, 20%);
        width: 2px;
        height: min(6.5vmin, 47px);
        transform: translateX(-50%);
        border-radius: 999px;
        background: #080808;
        transition: height 150ms ease-out, width 150ms ease-out, box-shadow 150ms ease-out;
      }

      .slider-value {
        position: absolute;
        bottom: min(8.9vmin, 64px);
        left: var(--slider-x, 20%);
        min-width: min(5.1vmin, 37px);
        padding: min(0.55vmin, 4px) min(1vmin, 7px);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: rgba(8, 8, 8, 0.48);
        font-size: min(2.35vmin, 17px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1;
        text-align: center;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(5px) scale(0.96);
        transition: opacity 150ms ease-out, transform 150ms ease-out;
      }

      .percentage-slider.is-interacting .slider-value {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }

      .battery-range:hover + .slider-visual .tick,
      .battery-range:active + .slider-visual .tick,
      .percentage-slider.is-interacting .tick {
        height: min(3.7vmin, 27px);
        background: rgba(14, 14, 14, 0.24);
      }

      .battery-range:hover + .slider-visual .tick:nth-child(5n + 1),
      .battery-range:active + .slider-visual .tick:nth-child(5n + 1),
      .percentage-slider.is-interacting .tick:nth-child(5n + 1) {
        height: min(5.3vmin, 38px);
        background: rgba(14, 14, 14, 0.28);
      }

      .battery-range:hover + .slider-visual .tick:first-child,
      .battery-range:hover + .slider-visual .tick:last-child,
      .battery-range:active + .slider-visual .tick:first-child,
      .battery-range:active + .slider-visual .tick:last-child,
      .percentage-slider.is-interacting .tick:first-child,
      .percentage-slider.is-interacting .tick:last-child {
        height: min(6.3vmin, 45px);
      }

      .battery-range:hover + .slider-visual .slider-marker,
      .battery-range:active + .slider-visual .slider-marker,
      .percentage-slider.is-interacting .slider-marker {
        width: 3px;
        height: min(7.6vmin, 55px);
        box-shadow: 0 0 0 5px rgba(0, 0, 0, 0.06);
      }

      .battery-range:focus-visible + .slider-visual .slider-marker {
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.13);
      }

      .slider-labels {
        display: flex;
        justify-content: space-between;
        color: rgba(0, 0, 0, 0.32);
        font-size: min(2.15vmin, 15.5px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1;
      }

      @keyframes liquid-stream {
        0% {
          filter: saturate(1) brightness(1);
          transform: translate3d(-1.8%, 0, 0) scaleY(1);
          background-position: 0% 50%, 60% 50%, 0% 50%;
        }
        50% {
          filter: saturate(1.06) brightness(1.05);
          transform: translate3d(1.6%, -1.5%, 0) scaleY(1.025);
          background-position: 18% 50%, 44% 48%, 9% 50%;
        }
        100% {
          filter: saturate(1) brightness(1);
          transform: translate3d(-1.8%, 0, 0) scaleY(1);
          background-position: 0% 50%, 60% 50%, 0% 50%;
        }
      }

      @keyframes liquid-front {
        0% {
          border-radius: 62% 38% 46% 54% / 38% 56% 44% 62%;
          transform: translate3d(-2%, 1%, 0) rotate(-1.8deg) scaleY(1.03);
        }
        35% {
          border-radius: 43% 57% 59% 41% / 55% 42% 58% 45%;
          transform: translate3d(6%, -3%, 0) rotate(2.4deg) scaleY(0.96);
        }
        70% {
          border-radius: 55% 45% 39% 61% / 44% 61% 39% 56%;
          transform: translate3d(1%, 4%, 0) rotate(-0.8deg) scaleY(1.06);
        }
        100% {
          border-radius: 62% 38% 46% 54% / 38% 56% 44% 62%;
          transform: translate3d(-2%, 1%, 0) rotate(-1.8deg) scaleY(1.03);
        }
      }

      @keyframes charge-width {
        0%,
        8.3% {
          width: 20%;
          min-width: 20%;
        }
        10% {
          width: 44%;
          min-width: 20%;
        }
        11.6% {
          width: 79%;
          min-width: 20%;
        }
        14%,
        57.8% {
          width: 100%;
          min-width: 20%;
        }
        59.2% {
          width: 77%;
          min-width: 20%;
        }
        61% {
          width: 45%;
          min-width: 20%;
        }
        66.7%,
        100% {
          width: 20%;
          min-width: 20%;
        }
      }

      @keyframes charge-color {
        0%,
        8.8%,
        64%,
        100% {
          background:
            radial-gradient(80% 96% at 16% 50%, rgba(255, 0, 66, 0.98), rgba(255, 11, 66, 0.92) 43%, rgba(255, 42, 44, 0.94) 74%, rgba(255, 135, 24, 0.98) 100%),
            linear-gradient(90deg, #ff003f, #ff1837 63%, #ff8518);
          box-shadow:
            inset min(1.2vmin, 9px) 0 min(2.05vmin, 15px) rgba(255, 255, 255, 0.08),
            inset max(-0.55vmin, -4px) 0 min(1.25vmin, 9px) rgba(255, 247, 29, 0.38),
            0 0 min(2.65vmin, 19px) rgba(255, 20, 58, 0.56);
        }
        10.4%,
        61% {
          background:
            radial-gradient(84% 98% at 15% 50%, rgba(255, 61, 28, 0.98), rgba(255, 83, 26, 0.94) 44%, rgba(255, 154, 24, 0.96) 74%, rgba(255, 232, 32, 0.98) 100%),
            linear-gradient(90deg, #ff3621, #ff771b 62%, #ffe321);
          box-shadow:
            inset min(1.2vmin, 9px) 0 min(2.05vmin, 15px) rgba(255, 255, 255, 0.08),
            inset max(-0.55vmin, -4px) 0 min(1.25vmin, 9px) rgba(255, 247, 29, 0.42),
            0 0 min(2.65vmin, 19px) rgba(255, 113, 34, 0.48);
        }
        14%,
        57.8% {
          background:
            radial-gradient(88% 108% at 0% 50%, rgba(0, 109, 26, 0.98), rgba(15, 190, 25, 0.98) 43%, rgba(55, 255, 22, 0.98) 70%, rgba(244, 255, 28, 1) 100%),
            linear-gradient(90deg, #006b1b, #1fff15 64%, #efff21);
          box-shadow:
            inset min(1.2vmin, 9px) 0 min(2.35vmin, 17px) rgba(0, 61, 10, 0.34),
            inset max(-0.7vmin, -5px) 0 min(1.5vmin, 11px) rgba(255, 255, 61, 0.52),
            0 0 min(2.9vmin, 21px) rgba(50, 255, 22, 0.62);
        }
      }

      @keyframes green-fill {
        0%,
        9.4% {
          opacity: 0;
        }
        11.8% {
          opacity: 0.88;
        }
        14%,
        57.8% {
          opacity: 1;
        }
        60% {
          opacity: 0.42;
        }
        63.8%,
        100% {
          opacity: 0;
        }
      }

      @keyframes battery-shell {
        0%,
        8.8%,
        64%,
        100% {
          box-shadow:
            inset 0 0 0 min(0.46vmin, 3.3px) rgba(255, 96, 114, 0.46),
            inset 0 min(1.7vmin, 12px) min(2.65vmin, 19px) rgba(255, 255, 255, 0.075),
            inset 0 max(-1.1vmin, -8px) min(2.25vmin, 16px) rgba(255, 91, 82, 0.24),
            0 min(1.65vmin, 12px) min(3.45vmin, 25px) rgba(255, 39, 70, 0.32),
            0 min(0.55vmin, 4px) min(1.25vmin, 9px) rgba(0, 0, 0, 0.2);
        }
        10.4%,
        61% {
          box-shadow:
            inset 0 0 0 min(0.46vmin, 3.3px) rgba(255, 171, 75, 0.46),
            inset 0 min(1.7vmin, 12px) min(2.65vmin, 19px) rgba(255, 255, 255, 0.075),
            inset 0 max(-1.1vmin, -8px) min(2.25vmin, 16px) rgba(255, 130, 41, 0.26),
            0 min(1.65vmin, 12px) min(3.45vmin, 25px) rgba(255, 102, 41, 0.3),
            0 min(0.55vmin, 4px) min(1.25vmin, 9px) rgba(0, 0, 0, 0.2);
        }
        14%,
        57.8% {
          box-shadow:
            inset 0 0 0 min(0.46vmin, 3.3px) rgba(88, 255, 39, 0.5),
            inset 0 min(1.7vmin, 12px) min(2.65vmin, 19px) rgba(255, 255, 255, 0.09),
            inset 0 max(-1.1vmin, -8px) min(2.25vmin, 16px) rgba(116, 255, 42, 0.27),
            0 min(1.75vmin, 13px) min(3.65vmin, 26px) rgba(77, 255, 39, 0.36),
            0 min(0.55vmin, 4px) min(1.25vmin, 9px) rgba(0, 0, 0, 0.2);
        }
      }

      @keyframes card-shadow {
        0%,
        8.8%,
        64%,
        100% {
          box-shadow:
            inset 0 min(1.35vmin, 10px) min(2.25vmin, 16px) rgba(255, 255, 255, 0.055),
            inset 0 max(-2.35vmin, -17px) min(3.9vmin, 28px) rgba(255, 54, 68, 0.12),
            0 min(3.9vmin, 28px) min(7.3vmin, 53px) rgba(111, 14, 33, 0.28),
            0 min(1.2vmin, 9px) min(2.2vmin, 16px) rgba(0, 0, 0, 0.18);
        }
        10.4%,
        61% {
          box-shadow:
            inset 0 min(1.35vmin, 10px) min(2.25vmin, 16px) rgba(255, 255, 255, 0.055),
            inset 0 max(-2.35vmin, -17px) min(3.9vmin, 28px) rgba(255, 114, 46, 0.11),
            0 min(3.9vmin, 28px) min(7.3vmin, 53px) rgba(147, 59, 12, 0.24),
            0 min(1.2vmin, 9px) min(2.2vmin, 16px) rgba(0, 0, 0, 0.18);
        }
        14%,
        57.8% {
          box-shadow:
            inset 0 min(1.35vmin, 10px) min(2.25vmin, 16px) rgba(255, 255, 255, 0.06),
            inset 0 max(-2.35vmin, -17px) min(3.9vmin, 28px) rgba(68, 255, 39, 0.1),
            0 min(3.9vmin, 28px) min(7.3vmin, 53px) rgba(41, 194, 39, 0.25),
            0 min(1.2vmin, 9px) min(2.2vmin, 16px) rgba(0, 0, 0, 0.18);
        }
      }

      @keyframes red-mood {
        0%,
        8.8%,
        64%,
        100% {
          opacity: 1;
        }
        14%,
        57.8% {
          opacity: 0.1;
        }
      }

      @keyframes green-mood {
        0%,
        9.4%,
        63.8%,
        100% {
          opacity: 0;
        }
        14%,
        57.8% {
          opacity: 1;
        }
      }

      @keyframes matrix-tint {
        0%,
        8.8%,
        64%,
        100% {
          opacity: 0.25;
          background-image: radial-gradient(circle, rgba(255, 129, 112, 0.21) 0 0.8px, transparent 1.55px);
        }
        14%,
        57.8% {
          opacity: 0.24;
          background-image: radial-gradient(circle, rgba(107, 255, 58, 0.17) 0 0.8px, transparent 1.55px);
        }
      }

      @keyframes inner-glow {
        0%,
        8.8%,
        64%,
        100% {
          background: radial-gradient(88% 92% at 17% 53%, rgba(255, 42, 64, 0.42), rgba(255, 42, 64, 0.1) 38%, transparent 72%);
        }
        10.4%,
        61% {
          background: radial-gradient(88% 92% at 22% 53%, rgba(255, 108, 38, 0.38), rgba(255, 167, 30, 0.12) 48%, transparent 74%);
        }
        14%,
        57.8% {
          background: radial-gradient(102% 98% at 54% 53%, rgba(60, 255, 23, 0.32), rgba(60, 255, 23, 0.15) 46%, transparent 76%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .recharge-overlay,
        .recharge-overlay::after,
        .mood-red,
        .mood-green,
        .battery,
        .charge-fill,
        .charge-fill::before,
        .charge-fill::after,
        .liquid-wave,
        .battery-glow {
          animation-play-state: paused;
        }
      }
    </style>
  </head>
  <body data-charge-state="low" style="--battery-level: 20%; --slider-x: 20%">
    <div class="app">
      <main class="stage" aria-label="Recharge charging overlay">
        <section class="recharge-overlay" aria-hidden="true">
          <span class="mood mood-red"></span>
          <span class="mood mood-green"></span>
          <h1 class="title">Recharge</h1>
          <div class="scale">
            <span>0</span>
            <span>50</span>
            <span>100</span>
          </div>
          <div class="battery">
            <span class="battery-glow"></span>
            <span class="charge-fill">
              <svg class="liquid-wave" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <defs>
                  <linearGradient id="liquid-front-gradient" x1="0" y1="0" x2="1" y2="0">
                    <stop class="front-start" offset="0%" style="stop-color: var(--liquid-front-start); stop-opacity: 1" />
                    <stop class="front-mid" offset="52%" style="stop-color: var(--liquid-front-mid); stop-opacity: 1" />
                    <stop class="front-end" offset="100%" style="stop-color: var(--liquid-front-end); stop-opacity: 1" />
                  </linearGradient>
                </defs>
                <path id="liquid-path" d="" fill="url(#liquid-front-gradient)" />
              </svg>
            </span>
          </div>
        </section>
      </main>

      <div class="percentage-slider">
        <div class="slider-field">
          <input class="battery-range" id="battery-range" type="range" min="0" max="100" step="0.1" value="20" aria-label="Battery percentage" />
            <div class="slider-visual" aria-hidden="true">
              <div class="slider-ticks" id="slider-ticks"></div>
              <span class="slider-marker"></span>
              <span class="slider-value" id="slider-value">20</span>
            </div>
        </div>
        <div class="slider-labels" aria-hidden="true">
          <span>0%</span>
          <span>100%</span>
        </div>
      </div>
    </div>

    <script>
      const range = document.querySelector("#battery-range");
      const ticks = document.querySelector("#slider-ticks");
      const percentageSlider = document.querySelector(".percentage-slider");
      const sliderValue = document.querySelector("#slider-value");
      const liquidPath = document.querySelector("#liquid-path");
      const AUTO_CHARGE_PER_MS = 11 / 60000;
      const REST_LIQUID_SPEED = 1.1;
      let batteryValue = Number(range.value);
      let autoChargeValue = batteryValue;
      let displayedBatteryValue = batteryValue;
      let previousBatteryValue = batteryValue;
      let slideDirection = 1;
      let isSliding = false;
      let slideStartTime = 0;
      let lastLiquidFrameTime = 0;
      let lastInputTime = 0;
      let sliderInteractionTimer;

      ticks.innerHTML = Array.from({ length: 41 }, () => "<span class='tick'></span>").join("");

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function showSliderInteraction() {
        percentageSlider.classList.add("is-interacting");
        window.clearTimeout(sliderInteractionTimer);
        sliderInteractionTimer = window.setTimeout(() => {
          if (!isSliding) percentageSlider.classList.remove("is-interacting");
        }, 420);
      }

      function liquidShape(value, time) {
        const x = clamp(value, 0, 100);

        if (x <= 0.25) {
          return "M0 0 Z";
        }

        if (x >= 99.98) {
          return "M0 0 H100 V100 H0 Z";
        }

        const phase = time * 0.0014 * (isSliding ? 1 : REST_LIQUID_SPEED);
        const cap = 0;
        const endEase = clamp((100 - x) / 5, 0, 1);

        const slidingAge = time - lastInputTime;
        const slidingStrength = (isSliding ? 0.48 : clamp(1 - slidingAge / 780, 0, 1) * 0.34) * endEase;
        const cycleStart = slideStartTime || time;
        const fallingCenter = ((time - cycleStart) * 0.16) % 150 - 25;
        const amp = clamp(x * 0.025, 0.65, 1.75) * slidingStrength;
        const restAmp = clamp(x * 0.008, 0.12, 0.38) * endEase;
        function edgeAt(y, edgeFactor) {
          const distance = y - fallingCenter;
          const rest =
            (Math.sin(phase + y * 0.095) * 0.65 + Math.sin(phase * 1.45 + y * 0.045) * 0.35) *
            restAmp *
            edgeFactor;
          const crest = Math.exp(-(distance ** 2) / 580) * amp * slideDirection;
          const softTrail = Math.exp(-((distance + 22) ** 2) / 900) * amp * -0.08 * slideDirection;
          return clamp(x + rest + crest + softTrail, cap * edgeFactor, 100);
        }

        const top = edgeAt(0, 0.15);
        const c1 = edgeAt(15, 0.56);
        const c2 = edgeAt(34, 0.95);
        const mid = edgeAt(50, 1);
        const c3 = edgeAt(66, 0.94);
        const c4 = edgeAt(85, 0.55);
        const bottom = edgeAt(100, 0.15);

        return `M-6 0 H${top.toFixed(2)} C${c1.toFixed(2)} 14 ${c2.toFixed(2)} 32 ${mid.toFixed(2)} 50 C${c3.toFixed(2)} 69 ${c4.toFixed(2)} 86 ${bottom.toFixed(2)} 100 H-6 Z`;
      }

      function updateBattery({ showInteraction = true, animateLiquidMotion = true, preserveAutoValue = false } = {}) {
        const value = Number(range.value);
        const state = value < 30 ? "low" : value < 66 ? "mid" : "high";
        if (value !== previousBatteryValue) {
          slideDirection = value > previousBatteryValue ? 1 : -1;
          if (animateLiquidMotion) {
            lastInputTime = performance.now();
            if (!isSliding) slideStartTime = lastInputTime;
          }
          if (showInteraction) showSliderInteraction();
        }
        previousBatteryValue = value;
        batteryValue = value;
        if (!preserveAutoValue) autoChargeValue = value;

        document.body.dataset.chargeState = state;
        document.body.style.setProperty("--slider-x", `${value}%`);
        sliderValue.textContent = Math.round(value);
        range.setAttribute("aria-valuetext", `${Math.round(value)}%`);
      }

      function animateLiquid(time) {
        if (!lastLiquidFrameTime) lastLiquidFrameTime = time;
        const delta = Math.min(time - lastLiquidFrameTime, 80);
        lastLiquidFrameTime = time;

        if (!isSliding && autoChargeValue < 100) {
          autoChargeValue = clamp(autoChargeValue + delta * AUTO_CHARGE_PER_MS, 0, 100);
          range.value = autoChargeValue.toFixed(1);
          updateBattery({ showInteraction: false, animateLiquidMotion: false, preserveAutoValue: true });
        }

        const followDuration = isSliding ? 170 : 260 / REST_LIQUID_SPEED;
        const followAmount = 1 - Math.exp(-delta / followDuration);
        displayedBatteryValue += (batteryValue - displayedBatteryValue) * followAmount;

        if (Math.abs(batteryValue - displayedBatteryValue) < 0.02) {
          displayedBatteryValue = batteryValue;
        }

        liquidPath.setAttribute("d", liquidShape(displayedBatteryValue, time));
        requestAnimationFrame(animateLiquid);
      }

      range.addEventListener("pointerdown", () => {
        isSliding = true;
        percentageSlider.classList.add("is-interacting");
        slideStartTime = performance.now();
        lastInputTime = slideStartTime;
      });
      range.addEventListener("pointerup", () => {
        isSliding = false;
        lastInputTime = performance.now();
        showSliderInteraction();
      });
      range.addEventListener("pointercancel", () => {
        isSliding = false;
        lastInputTime = performance.now();
        showSliderInteraction();
      });
      range.addEventListener("input", updateBattery);
      updateBattery();
      requestAnimationFrame(animateLiquid);
    </script>
  </body>
</html>
